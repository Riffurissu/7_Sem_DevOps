services:
  backend:
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  nginx:
    volumes: !override
      - ./nginx/conf.d/debug.conf:/etc/nginx/conf.d/default.conf:ro
    ports: !override
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-8443}:8443"
      - "${DEBUG_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://127.0.0.1:8443/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
