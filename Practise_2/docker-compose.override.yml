services:
  backend:
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  nginx:
    volumes:
      - ./nginx/conf.d/debug.conf:/etc/nginx/conf.d/default.conf:ro
    ports: !override
      - "${DEBUG_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
