services:
  backend:
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  nginx:
    volumes: !override
      - ./nginx/conf.d/debug.conf:/etc/nginx/conf.d/default.conf:ro
    ports: !override
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
